spring.application.name=tazkara
server.port=8080
# spring.profiles.active=dev
tazkara.jwt.secret=change-me-in-production-32-bytes-minimum-secret!
tazkara.jwt.expiry-minutes=60

spring.datasource.url=jdbc:postgresql://localhost:5432/tazkara
spring.datasource.username=tazkara
spring.datasource.password=tazkara
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
# redis

spring.cache.redis.time-to-live=20m

